<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-sm-10 mx-auto bg-info p-5">
                <div class="row">
                    <div class="col-sm-3">
                        <div class="mt-5">
                            <h2>Welcome</h2>
                            <p class="text">You are 30 minutes away <br>
                                from coming your own money
                            </p>
                        </div>

                        <button class="btn text-bg-dark">Login</button>
                    </div>
                    <div class="col-sm-9 bg-white p-3">
                        <div class="row">
                            <div class="col-sm-3 float-end">
                                <button class="btn btn-primary">Employee</button>
                            </div>
                        </div>
                        <h2 class="text-center mb-4">Apply as a Employee</h2>

                        <div class="row">
                            <div class="col-sm-6">
                                <input type="text" placeholder="First Name*" class="form-control mb-3">
                                <input type="text" placeholder="Last Name*" class="form-control mb-3">
                                <input type="password" placeholder="Password *" class="form-control mb-3">
                                <input type="password" placeholder="Confirm Password *" class="form-control mb-3">
                            </div>
                            <div class="col-sm-6">
                                <input type="email" placeholder="Your Email*" class="form-control mb-3">
                                <input type="number" placeholder="Your Phone*" class="form-control mb-3">
                                <input type="text" placeholder="Please select your security question *"
                                    class="form-control mb-3">
                                <input type="text" placeholder="Enter Your Answer *" class="form-control mb-3">
                            </div>
                            <div class="row">
                                <div class="col-sm-12">
                                    <input type="radio"> <b>Male</b>
                                    <input type="radio"> <b>Female</b>
                                </div>
                            </div>
                            <button class="btn btn-primary w-25 rounded-4 float-end ">Register</button>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
