<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    <style>
        .h {
            min-height: 450px;
        }

        .area {
            height: 100px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-sm-7 mx-auto bg-white mt-5 shadow-lg h p-4 rounded">
                <div class="row">
                    <div class="col-sm-12">
                        <h2 class="">Send Us Message</h2>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-6">
                        <label for="name">Name</label>
                        <input type="text" id="name" class="form-control">
                        <b id="b1"></b>
                        <br> <br>

                        <label for="number">Mobile</label>
                        <input type="number" id="number" class="form-control">
                        <b id="b2"></b>
                        <br> <br>
                    </div>
                    <div class="col-sm-6">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control">
                        <b id="b3"></b>
                        <br> <br>
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" class="form-control">
                        <b id="b4"></b>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12">
                        <label for="message">Message</label>
                        <input type="textarea" id="message" class="form-control area">
                        <b id="b5"></b>
                        <br>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12 mt-4">
                        <button class="btn btn-warning p-2 w-100 rounded-5 text-white fw-bold fs-5 "
                            onclick="textvalue()">
                            Send Enquiry</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var nam = document.getElementById("name")
        var number = document.getElementById("number")
        var email = document.getElementById("email")
        var subject = document.getElementById("subject")
        var message = document.getElementById("message")

        var b1 = document.getElementById("b1")
        var b2 = document.getElementById("b2")
        var b3 = document.getElementById("b3")
        var b4 = document.getElementById("b4")
        var b5 = document.getElementById("b5")

        function textvalue() {
            var nameValue = nam.value
            var numberValue = number.value
            var emailValue = email.value
            var subjectValue = subject.value
            var messageValue = message.value

            b1.innerText = nam.value
            b2.innerText = numberValue
            b3.innerText = emailValue
            b4.innerText = subjectValue
            b5.innerText = messageValue

            b1.style.color = "green"
            b2.style.color = "yellow"
            b3.style.color = "green"
            b4.style.color = "aqua"
            b5.style.color = "blue"


        }
    </script>
    <script src="js/bootstrap.bundle.js"> </script>
</body>

</html>
