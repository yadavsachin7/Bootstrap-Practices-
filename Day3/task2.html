<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/bootstrap.css">
    <link rel="stylesheet" href="/css/all.css">
    <style>
        .h
        {
            height: 470px;
            width: 400px;
        }
        .ht
        {
            height: 620px;
            width: 550px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-sm-6 bg-success mx-auto p-2 mt-5 ht">
                
                <div class="row">
                    <div class="col-sm-8 bg-white mx-auto p-3 my-5 h rounded ">
                            <p class="fs-3"><b>Sign Up </b></p>
                            <p >Please fill in this form to create an account</p>
                            <hr class="w-100">

                            <div class="input-group mb-3">
                                <span class="input-group-text text-bg-light">
                                    <i class="fa-solid fa-user"></i>
                                </span>
                                <input type="text" placeholder="Username" class="form-control">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text text-bg-light">
                                    <i class="fa-solid fa-envelope"></i>
                                </span>
                                <input type="email" placeholder="Email Address" class="form-control">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text text-bg-light">
                                    <i class="fa-solid fa-lock"></i>
                                </span>
                                <input type="password" placeholder="Password" class="form-control">
                            </div>
                            <div class="input-group mb-2">
                                <span class="input-group-text text-bg-light">
                                    <i class="fa-solid fa-lock"></i>
                                </span>
                                <input type="password" placeholder="Conform Password" class="form-control">
                            </div>
                            <p>
                                <input type="checkbox">
                                I accept the <span class="text-success">Terms of Use & Privacy Policy</span></p>
                            <button class="btn btn-success w-50">Sign Up</button>
                    </div>
                    <p class="text-center  text-white ">Already have an account ? <u >Login here</u></p>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.js"></script>
</body>
</html>
