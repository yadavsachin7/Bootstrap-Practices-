<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/bootstrap.css">
    <link rel="stylesheet" href="/css/all.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-12 bg-primary mx-auto p-2 mt-5">
                
                <div class="row">
                    <div class="col-sm-4 bg-white mx-auto p-4 my-5 rounded-1 ">
                            <p class="fs-3"><b>Regitration  </b></p>
                            <p >Enter your Details to register</p>

                            
                                <input type="text" placeholder="First Name" class="form-control mb-3 fw-bold">
                                <input type="text" placeholder="Last Name " class="form-control mb-3 fw-bold">
                                <input type="email" placeholder="Email" class="form-control mb-3 fw-bold">
                                <input type="password" placeholder="Password" class="form-control mb-3 fw-bold">
                            
                            
                            <p>
                                <input type="checkbox">
                                I agree to the <span class="text-primary">Terms and conditions</span></p>
                            <button class="btn btn-primary w-100 p-2">Sign Up</button>
                            <hr>
                            <p class="text-center">Already have an account ? <u >Login here</u></p>
                            <p>Or continue with</p>
                            <button class="btn btn-danger w-100 p-2">
                                <i class="fa-brands fa-google"></i>
                                SIGN IN WITH GOOGLE
                            </button>

                            <button class="btn btn-primary w-100 mt-3 p-2">
                                <i class="fa-brands fa-facebook"></i>
                                SIGN IN WITH FACEBOOK
                            </button>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.js"></script>
</body>
</html>
