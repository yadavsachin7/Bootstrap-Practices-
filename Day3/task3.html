<html>

<head>

    <link rel="stylesheet" href="/css/all.css">
    <link rel="stylesheet" href="/css/bootstrap.css">
    
</head>


<body>
        <div class="container bg-success">
            <div class="row">
                <div class="col-md-10 w-50  bg-info mx-auto mt-3 pt-5 ps-5 rounded shadow-lg">
                    <p class="text-white fs-5 ">Sign up once and watch our free things.</p>

 <!--div 1  -->
            <p class="text-white fs-5 ">Your Name</p>
            <div class="input-group  ">
                <span class="input-group-text">
                    <i class="fa-solid fa-user"></i>
                </span>
                <input type="text" placeholder="Enter Your Name " class="form-control fw-bold ">
                </div>
<!-- div-2 -->
                 <p class="text-white fs-5 mt-4">Your Email</p>
                <div class="input-group ">
               <span class="input-group-text">
                    <i class="fa-solid fa-envelope"></i>
                </span>
                <input type="email" placeholder="Enter Your Email " class="form-control fw-bold ">
                </div>

                <!-- div 3 -->
                <p class="text-white fs-5 mt-4 ">Your UserName</p>
                <div class="input-group ">
                <span class="input-group-text">
                    <i class="fa-solid fa-id-badge"></i>
                </span>
                <input type="text" placeholder="Enter Your UserName " class="form-control fw-bold ">
                </div>

                <!-- div 4 -->
                  <p class="text-white fs-5 mt-4 ">Your Password</p>
                 <div class="input-group ">
                <span class="input-group-text">
                    <i class="fa-solid fa-lock"></i>
                </span>
                <input type="text" placeholder="Enter Your Password " class="form-control fw-bold ">
                </div>

                <!-- div-5 -->
                <p class="text-white fs-5 mt-4"> Confirm Your Password</p>
                <div class="input-group ">
                <span class="input-group-text">
                   <i class="fa-solid fa-unlock"></i>
                </span>
                <input type="text" placeholder="Confirm Your Password " class="form-control fw-bold  ">
                </div>

                <button class="btn bg-white  mt-5 mb-5 fw-bold w-100">Register</button>
</div>

            </div>

        </div>

</body>
</html>
