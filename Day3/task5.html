<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/all.css">
    <link rel="stylesheet" href="/css/bootstrap.css">  
    <style>
        .bg-color
        {
            background:linear-gradient(120deg , orange,red);
        }
    </style>                       

</head>
<body>
    <div class="container bg-light">
        <div class="row">
            <div class="col-sm-11 mx-auto g-4"> 
                <h2 class="ms-4">Form</h2>   
                <div class="row "> 
                    <div class="col-sm-3 bg- ms-5" > 
                        <div class="text-center bg-color text-white p-3 ">
                        <h5 class="">Log in </h5>
                        <i class="fa-brands fa-facebook  m-2"></i>
                        <i class="fa-brands fa-twitter m-2"></i>
                        <i class="fa-brands fa-google-plus-g m-2"></i>
                        </div>

                       <div class="bg-white">
                         <p class="pt-4">Your Mail</p>
                        <hr>
                        <p>Your Password</p>
                        <hr>

                        <p class="float-end">Forgot <b>Password ?</b></p> <br> <br> 

                        <button class="btn btn-dark rounded-5 ">LOG IN </button>

                        <p>Don't have an account? <b>Sign up</b></p>

                       </div>

                    </div>   
                       <!-- 2nd div    -->
                    <div class="col-sm-3 bg-white ms-5 " > 
                        <div>
                            <h5 class="text-danger text-center fw-bold mt-3">Sign Up</h5>
                        
                         <p class="pt-4">Your Mail</p>
                        <hr>
                        <p>Your Password</p>
                        <hr>

                        <p><input type="checkbox">
                          Accept the <span class="text-primary">Terms and Condition</span>
                        </p>
                        
                        <button class="btn btn-danger rounded-5 ">LOG IN </button>

                        <p>Don't have an account? <b>Log in</b></p>
                        
                        </div>

                        <div class="bg-secondary p-3 text-white ">
                            <i class="fa-brands fa-facebook  ms-5"></i>
                        <i class="fa-brands fa-twitter ms-4"></i>
                        <i class="fa-brands fa-google-plus-g ms-4"></i>
                        </div>

                       
                    </div> 

                    <!-- 3rd form  -->
                    <div class="col-sm-3 bg-white ms-5" > 
                        
                    <div>
                            <h5 class=" text-center fw-bold mt-3">Sign in</h5>
                        
                         <p class="pt-4">Your Mail</p>
                        <hr>
                        <p>Your Password</p>
                        <hr>

                        <p class="text-primary float-end">Forgot Password</p> <br> <br>
                        <button class="btn btn-primary rounded-5  w-100">LOG IN </button>

                        <p class="text-center mt-3">or Sign in with</p>
                        
                        </div>

                        <div class=" p-3 text-white ">
                            <button class="w-25 rounded-5 text-primary btn btn-outline-primary ms-2"><i class="fa-brands fa-facebook"></i></button>
                            <button class="w-25 rounded-5 text-primary btn btn-outline-primary ms-2"><i class="fa-brands fa-twitter"></i></button>
                            <button class="w-25 rounded-5 text-primary btn btn-outline-primary ms-2"><i class="fa-brands fa-google-plus-g"></i></button>
                        
                        </div>

                       
                    </div>     
                    
                </div>

            </div>
        </div>
    </div>
</body>
</html>
