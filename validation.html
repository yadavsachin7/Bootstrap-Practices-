<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/all.css">

<body onload="tableData()">
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-4 mx-auto mt-5 bg-white rounded shadow-lg">
                <div class="div">
                    <h3 class=" text-center">Form <span class="text-warning">Validation</span></h3>
                </div>
                <!-- <form action=""> -->
                    <label for="name" class="fs-5">Name</label>
                    <input type="text" id="name" name="name" class="form-control " placeholder="Enter Your Name">
                    <p class="text-danger mb-3" id="nameErr"></p>
                    <label for="email" class="fs-5">Email</label>
                    <input type="email" id="email" name="email" class="form-control " placeholder="Enter Your Email">
                    <p class="text-danger mb-3" id="emailErr"></p>
                    <label for="phone" class="fs-5">Mobile</label>
                    <input type="text" id="phone" name="phone" class="form-control " placeholder="Enter Your Phone">
                    <p class="text-danger mb-4" id="phoneErr"></p>
                    <input type="submit" onclick="add()" value="submit" class="btn btn-warning w-100 text-light fs-5 mb-5">
                <!-- </form> -->
            </div>
        </div>
    <!-- This is table Section -->
    <div class="row">
        <div class="col-sm-8 mx-auto">
            <hr>
            <div class="div">
                    <h3 class=" text-center">Table <span class="text-warning mt-5">Data</span></h3>
            </div>
            <table class="table">
                <thead  class="table-dark">
                    <tr>
                        <th>SR NO.</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                                    
                </tbody>
            </table>
        </div>
    </div>

    </div>
    <script>
        const updateData = (index)=> {
            let data = JSON.parse(localStorage.getItem("info"))
            data.map((item) => {

            })
                
            
            
            // data.splice(index,1,data[index].name,"Mohan")           
            // alert(data)
            // localStorage.setItem('info',JSON.stringify(data))
        }

        const deleteData = (index)=> {
            let data = JSON.parse(localStorage.getItem('info'))
            data.splice(index,1)
            localStorage.setItem('info',JSON.stringify(data))
            tableData()



        }
        
        const tableData = ()=> {
            const data = JSON.parse(localStorage.getItem("info"))
            res=''
            data.forEach((item,index) => {
                
                res+=`
                <tr>
                        <td>#${index+1}</td>
                        <td>${item.name}</td>
                        <td>${item.email}</td>
                        <td>${item.phone}</td>
                        <td>
                            <button class="btn btn-danger" onclick="deleteData(${index})">Del</button>
                            <button class="btn btn-success" onclick="updateData(${index})"  >Edit</button>
                        </td>
                    </tr>
                `
            });
            document.querySelector("tbody").innerHTML=res;

        }
        
        const validate = () => {
            let name = document.querySelector("#name")
            let email = document.querySelector("#email")
            let phone = document.querySelector("#phone")
            let nameErr = document.querySelector("#nameErr")
            let emailErr = document.querySelector("#emailErr")
            let phoneErr = document.querySelector("#phoneErr")
            nameErr.innerHTML=''
            emailErr.innerHTML=''
            phoneErr.innerHTML=''

            let allow =true;
            let nameReg = /^[a-zA-Z ]{2,18}$/;
            if(nameReg.test(name.value)==false){
                nameErr.innerHTML="Please Enter A valid Name"
                allow  = false
            }
            // let emailReg = /^(?=.+[a-z0-9])(?=.@{1})\.{1}()$/; /// correct kerna hai 
            let emailReg = /^[a-zA-Z0-9]+@[a-zA-Z0-9]+\.[a-zA-Z]{2,}$/; /// correct kerna hai 
            if(emailReg.test(email.value)==false){
                emailErr.innerHTML="Please Enter A valid Email"
                allow  = false
            }
            let phoneReg = /^[6-9]{1}[0-9]{9}$/; 
            if(phoneReg.test(phone.value)==false){ 
                phoneErr.innerHTML="Please Enter A valid Mobile NO." 
                allow  = false
            }
            return allow;
        }

        const add = () => {
            const res = validate()
            // alert("hello")
            
            if(res==true){
                let name = document.querySelector("#name")
                let email = document.querySelector("#email")
                let phone = document.querySelector("#phone")
                // alert(`${name.value} ${email.value} ${phone.value}`)
                let obj = {
                    name:name.value,
                    email:email.value,
                    phone:phone.value
                }
                const data = JSON.parse(localStorage.getItem("info")) 
                if(data ==null){
                    localStorage.setItem("info",JSON.stringify([obj]))
                }
                else{
                    data.push(obj)
                    localStorage.setItem("info",JSON.stringify(data))
                }
                tableData()
                name.value=''
                email.value=''
                phone.value=''
            }        
        }

    </script>

    <!-- <script src="../js/bootstrap.bundle.js"></script> -->
</body>

</html>
